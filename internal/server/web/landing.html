<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>yoink · {{.Name}}</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --card: #ffffff; --text: #111827; --muted: #6b7280;
    --accent: #16a34a; --accent-text: #ffffff; --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f14; --card: #141a22; --text: #e5e7eb; --muted: #9ca3af;
      --accent: #22c55e; --accent-text: #052e13; --border: #232b36;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 420px; padding: 28px 24px; text-align: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  }
  .brand { font-weight: 800; letter-spacing: .04em; color: var(--accent); font-size: 14px; }
  h1 { font-size: 20px; margin: 16px 0 4px; overflow-wrap: anywhere; }
  .meta { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .btn {
    display: block; padding: 14px 18px; border-radius: 12px; font-size: 17px; font-weight: 700;
    background: var(--accent); color: var(--accent-text); text-decoration: none;
  }
  .hint { color: var(--muted); font-size: 13px; margin: 16px 0 0; }
</style>
</head>
<body>
<main class="card">
  <div class="brand">yoink</div>
  <h1>{{.Name}}</h1>
  <p class="meta">{{.Size}}{{if .IsZip}} · {{.Files}} file{{if ne .Files 1}}s{{end}}, zipped{{end}}</p>
  <a class="btn" href="{{.Href}}" download>Download</a>
  <p class="hint">Shared from a computer on your network.</p>
</main>
</body>
</html>
